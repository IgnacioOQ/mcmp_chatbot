runConfig:
  minInstances: 1
  maxInstances: 2
  memoryMiB: 512
  cpu: 1
  concurrency: 80

env:
  # The backend Cloud Run URL is IAM-protected, not sensitive — a plain value
  # avoids App Hosting secret-access wiring. (Was a Secret Manager ref.)
  - variable: BACKEND_URL
    value: "https://mcmp-firebase-backend-113682704284.us-central1.run.app"
    availability:
      - RUNTIME
  - variable: ALLOWED_ADMIN_EMAILS
    value: "ignacioojea@gmail.com"
    availability:
      - RUNTIME
  # Client-visible admin allowlist (used by the /admin page gate).
  - variable: NEXT_PUBLIC_ALLOWED_ADMIN_EMAILS
    value: "ignacioojea@gmail.com"
    availability:
      - BUILD
      - RUNTIME
  # Firebase web API key — public by design (shipped in the client bundle).
  - variable: NEXT_PUBLIC_FB_API_KEY
    value: "AIzaSyD5LltMLgeNVQ53XecHv7fNZIJ-9cEzT6Y"
    availability:
      - BUILD
      - RUNTIME
