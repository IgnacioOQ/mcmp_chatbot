runConfig:
  minInstances: 0
  maxInstances: 2
  memoryMiB: 512
  cpu: 1
  concurrency: 80

env:
  - variable: BACKEND_URL
    secret: BACKEND_URL        # populated in Secret Manager after Phase 4 (backend Cloud Run URL)
    availability:
      - RUNTIME
  - variable: ALLOWED_ADMIN_EMAILS
    value: "ignacioojea@gmail.com"
    availability:
      - RUNTIME
  # Client-visible admin allowlist (used by the /admin page gate).
  - variable: NEXT_PUBLIC_ALLOWED_ADMIN_EMAILS
    value: "ignacioojea@gmail.com"
    availability:
      - BUILD
      - RUNTIME
  # Firebase web API key — public by design. Set after registering the web app
  # during firebase init (Phase 5.6 / 2.9). Placeholder until then.
  - variable: NEXT_PUBLIC_FB_API_KEY
    value: "REPLACE_AFTER_WEBAPP_REGISTRATION"
    availability:
      - BUILD
      - RUNTIME
